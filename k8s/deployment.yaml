apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: zeronika/my-java-app:latest
        ports:
        - containerPort: 8080        # ADDED: was missing before
        readinessProbe:              # ADDED: waits for Spring Boot to start
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:               # ADDED: restarts pod if it hangs
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15